<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050805">
<title>Goal Tracker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;min-height:100vh}
#app{position:relative;width:100%;max-width:1100px;background:#000}
#poster{display:block;width:100%;height:auto}
.hot{position:absolute;border:0;background:transparent;z-index:4}
.hot:active{background:rgba(120,255,50,.13);outline:1px solid rgba(120,255,50,.4)}
#nav{left:1%;top:26.5%;width:98%;height:5%}
#today{left:1%;top:31%;width:30%;height:37%}
#time{left:31.5%;top:31%;width:39%;height:37%}
#goals{left:71%;top:31%;width:28%;height:37%}
#bottom1{left:1%;top:68.5%;width:32%;height:13%}
#bottom2{left:34%;top:68.5%;width:32%;height:13%}
#bottom3{left:67%;top:68.5%;width:32%;height:13%}
#quotes{left:1%;top:82%;width:70%;height:16%}
#wins{left:72%;top:82%;width:27%;height:16%}
#fab{position:fixed;right:16px;bottom:18px;z-index:20;width:54px;height:54px;border:0;border-radius:50%;background:#75ff2d;color:#071007;font-size:28px;font-weight:900;box-shadow:0 5px 24px #7cff3355}
#shade{position:fixed;inset:0;background:#000c;z-index:40;display:none;align-items:flex-end}
#shade.open{display:flex}
#sheet{width:min(620px,100%);margin:auto;background:#0a100b;border:1px solid #46673b;border-radius:20px 20px 0 0;padding:18px;max-height:82vh;overflow:auto}
#sheet h2{margin:0 0 5px;font-size:18px}
.muted{color:#a8b2a5;font-size:12px}
.row{border:1px solid #2b3d2b;border-radius:10px;padding:11px;margin-top:8px}
input,select{width:100%;padding:12px;margin:7px 0;background:#111711;border:1px solid #40523d;border-radius:10px;color:#fff}
button.action{width:100%;padding:12px;border:0;border-radius:10px;background:#78ff32;color:#071007;font-weight:900;margin-top:8px}
button.danger{background:#ff4f4f;color:#190000}
.bar{height:10px;background:#283028;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#7cff32}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);z-index:60;background:#0c140c;border:1px solid #578447;border-radius:14px;padding:10px 14px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
let earnings=+localStorage.earnings||0,savings=+localStorage.savings||0,spending=+localStorage.spending||0,hours=+localStorage.hours||0,hellcat=+localStorage.hellcat||0,house=+localStorage.house||0;
const money=n=>'$'+Number(n).toLocaleString();
const toast=t=>{let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)};
const closePanel=()=>document.getElementById('shade').classList.remove('open');
const show=h=>{document.getElementById('sheet').innerHTML=h;document.getElementById('shade').classList.add('open')};

function openPanel(type){
if(type==='today')show(`<h2>📅 TODAY'S TRACKER</h2><div class=muted>Enter today's real numbers.</div><input id=e type=number placeholder="Earnings today" value="${earnings}"><input id=s type=number placeholder="Savings today" value="${savings}"><input id=sp type=number placeholder="Spending today" value="${spending}"><input id=h type=number placeholder="Hours worked" value="${hours}"><button class=action onclick="saveToday()">SAVE TODAY</button><button class="action danger" onclick="resetToday()">RESET</button>`);
else if(type==='time')show(`<h2>⏱ TIME BOXES</h2><div class=muted>8:00 AM → 10:30 PM, with catch-up checkpoints through the hard 1:00 AM stop.</div><div class=row>☐ 8:00 AM — Get ready</div><div class=row>☐ 9:00 AM — $16</div><div class=row>☐ 10:00 AM — $16</div><div class=row>☐ 11:00 AM — $16</div><div class=row>☐ 12:00 PM — $18</div><div class=row>☐ 1:00 PM — $18</div><div class=row>☐ 2:00 PM — $16</div><div class=row>☐ 3:00 PM — $16</div><div class=row>☐ 4:00 PM — $16</div><div class=row>☐ 5:00 PM — $16</div><div class=row>☐ 6:00 PM — $16</div><div class=row>☐ 7:00 PM — $16</div><div class=row>☐ 8:00 PM — $16</div><div class=row>☐ 9:00 PM — $16</div><div class=row>☐ 10:00 PM — $16</div><div class=row>☐ 10:30 PM — $18</div><div class=row>🌙 Catch-up: 11:00 PM · 11:30 PM · 12:00 AM · 12:30 AM</div><div class=row>🛑 <b>1:00 AM HARD STOP</b> — stop working no matter what.</div>`);
else if(type==='goals')show(`<h2>🏆 GOALS</h2><div class=row><b>DODGE CHARGER WIDEBODY HELLCAT</b><br>${money(hellcat)} saved of $60,000<div class=bar><i style="width:${Math.min(hellcat/60000*100,100)}%"></i></div><button class=action onclick="addGoal('hellcat',100)">+ $100</button><button class=action onclick="addGoal('hellcat',500)">+ $500</button><button class=action onclick="addGoal('hellcat',1000)">+ $1,000</button><button class="action danger" onclick="subtractGoal('hellcat')">Subtract Money</button></div><div class=row><b>TEXAS HOUSE</b><br>${money(house)} saved of $469,999<div class=bar><i style="width:${Math.min(house/469999*100,100)}%"></i></div><button class=action onclick="addGoal('house',100)">+ $100</button><button class=action onclick="addGoal('house',500)">+ $500</button><button class=action onclick="addGoal('house',1000)">+ $1,000</button><button class="action danger" onclick="subtractGoal('house')">Subtract Money</button></div>`);
else if(type==='weekly')show(`<h2>📊 WEEKLY TRACKER</h2><div class=row>Weekly earnings: ${money(earnings)}</div><div class=row>Weekly savings: ${money(savings)}</div><div class=row>Total hours: ${hours}h</div><div class=row>Weekly target: $1,680 ($240/day)</div>`);
else if(type==='monthly')show(`<h2>📅 MONTHLY TRACKER</h2><div class=row>Month earnings: ${money(earnings)}</div><div class=row>Month savings: ${money(savings)}</div><div class=row>Month spending: ${money(spending)}</div><div class=row>Days tracked: 0/30</div><div class=row>Monthly target: $7,200 ($240/day)</div>`);
else if(type==='motivation')show(`<h2>💬 MOTIVATION</h2><div class=row>“A year from now you'll wish you started today.”</div><div class=row>“Discipline turns goals into reality.”</div><div class=row>“Stay focused. Good things take time.”</div><div class=row>“Bigger plans. Same grind.”</div><div class=row>“This isn't just a car. It's freedom.”</div><div class=row>“You can do it.”</div>`);
else if(type==='wins')show(`<h2>✅ DAILY WINS</h2><div class=row>☐ I showed up and worked.</div><div class=row>☐ I tracked my earnings.</div><div class=row>☐ I protected my savings.</div><div class=row>☐ I stayed focused on the Hellcat goal.</div><div class=row>☐ I stayed focused on the Texas house goal.</div>`);
else if(type==='add')show(`<h2>💰 ADD MONEY</h2><div class=muted>Update your real goal progress.</div><input id=a type=number placeholder="Amount"><select id=f><option value=hellcat>Hellcat Goal</option><option value=house>Texas House Goal</option></select><button class=action onclick="saveAdd()">SAVE</button>`);
else show(`<h2>GOAL TRACKER</h2><div class=row>Dashboard</div><div class=row>Daily Tracker</div><div class=row>Time Boxes</div><div class=row>Hellcat Goal</div><div class=row>Texas House Goal</div><div class=row>Calendar</div><div class=row>Motivation</div>`);
}
function saveToday(){earnings=+e.value||0;savings=+s.value||0;spending=+sp.value||0;hours=+h.value||0;localStorage.earnings=earnings;localStorage.savings=savings;localStorage.spending=spending;localStorage.hours=hours;closePanel();toast('Today saved')}
function resetToday(){earnings=savings=spending=hours=0;localStorage.earnings=0;localStorage.savings=0;localStorage.spending=0;localStorage.hours=0;closePanel();toast('Today reset')}
